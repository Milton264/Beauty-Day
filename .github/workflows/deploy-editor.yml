name: Desplegar editor Beauty Day

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - worker/deploy-request.txt

permissions:
  contents: write

concurrency:
  group: beauty-day-editor-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Preparar credenciales del editor
        run: node worker/prepare-deploy-secrets.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BEAUTY_DAY_GITHUB_TOKEN: ${{ secrets.BEAUTY_DAY_GITHUB_TOKEN }}
          BEAUTY_DAY_ADMIN_PASSWORD: ${{ secrets.BEAUTY_DAY_ADMIN_PASSWORD }}

      - name: Desplegar Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4"
          command: deploy --secrets-file .deploy-secrets.json

      - name: Borrar archivo temporal de secretos
        if: always()
        run: rm -f worker/.deploy-secrets.json

      - name: Conectar el panel con la URL desplegada
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const url = new URL(process.env.DEPLOYMENT_URL);
          if (url.protocol !== 'https:' || !url.hostname.endsWith('.workers.dev')) {
            throw new Error('Cloudflare no devolvió una URL válida de workers.dev.');
          }
          writeFileSync('docs/admin/config.js', 'window.BEAUTY_DAY_API = ' + JSON.stringify(url.origin) + ';\n');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/admin/config.js
          if ! git diff --cached --quiet; then
            git commit -m "Conectar panel Beauty Day al Worker"
            git push
          fi

      - name: Mostrar el resultado
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "Worker: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Panel: https://milton264.github.io/Beauty-Day/admin/" >> "$GITHUB_STEP_SUMMARY"
